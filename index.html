<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biome | Nutrition Counselling</title>
  <link rel="icon" href="assets/biome-favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f4f0e7; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .loading { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; color: #4b5d49; background: #f4f0e7; font: 700 13px/1.2 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .ready .loading { display: none; }
  </style>
</head>
<body>
  <div class="loading" aria-live="polite">Preparing the biome preview…</div>
  <iframe id="biome-site" src="u-method-original.html" title="biome Nutrition Counselling website"></iframe>

  <script>
    const frame = document.getElementById('biome-site');
    const siteBase = new URL('.', window.location.href).pathname;
    const sitePath = (path = '') => `${siteBase}${path.replace(/^\/+/, '')}`;

    function wheelMarkup() {
      return `
        <span class="biome-o" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <circle class="biome-o-ring" cx="24" cy="24" r="15.5"></circle>
            <g class="biome-o-lines">
              <line x1="24" y1="24" x2="24" y2="5.5"></line>
              <line x1="24" y1="24" x2="37" y2="11"></line>
              <line x1="24" y1="24" x2="42.5" y2="24"></line>
              <line x1="24" y1="24" x2="37" y2="37"></line>
              <line x1="24" y1="24" x2="24" y2="42.5"></line>
              <line x1="24" y1="24" x2="11" y2="37"></line>
              <line x1="24" y1="24" x2="5.5" y2="24"></line>
              <line x1="24" y1="24" x2="11" y2="11"></line>
            </g>
            <g class="biome-o-nodes">
              <circle cx="24" cy="5.5" r="2"></circle><circle cx="37" cy="11" r="2"></circle>
              <circle cx="42.5" cy="24" r="2"></circle><circle cx="37" cy="37" r="2"></circle>
              <circle cx="24" cy="42.5" r="2"></circle><circle cx="11" cy="37" r="2"></circle>
              <circle cx="5.5" cy="24" r="2"></circle><circle cx="11" cy="11" r="2"></circle>
            </g>
            <circle class="biome-o-centre" cx="24" cy="24" r="8"></circle>
          </svg>
        </span>`;
    }

    function wordmarkMarkup(includeDescriptor = true) {
      return `
        <span class="biome-lockup">
          <span class="biome-wordmark" aria-label="biome"><span class="biome-bi">bio</span><span class="biome-me">me</span></span>
          ${includeDescriptor ? '<span class="biome-descriptor">Nutrition counselling</span>' : ''}
        </span>`;
    }

    function insuranceMarkup() {
      return `<summary><span class="insurance-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.6-2.8 8-7 10-4.2-2-7-5.4-7-10V6l7-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>Health Insurance Coverage</span></summary><p><strong>Extended health benefits:</strong> Many plans cover nutritional consulting. Coverage varies, so confirm directly with your provider. A receipt with the RNCP, NNCP and RRSW designations is issued after each session.</p>`;
    }

    function replaceText(root) {
      const walker = root.createTreeWalker(root.body, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((node) => {
        if (node.parentElement?.closest('script, style')) return;
        node.nodeValue = node.nodeValue
          .replaceAll('The U Digest', 'biome Digest')
          .replaceAll('The U Method', 'biome')
          .replaceAll('the U method', 'biome')
          .replaceAll('BIOME', 'biome');
      });
    }

    function rewriteBehaviourPage(doc) {
      const main = doc.querySelector('main');
      if (!main) return;
      main.innerHTML = `
        <section class="behaviour-relationship section-pad">
          <div class="section-shell">
            <div class="behaviour-relationship-copy"><p class="eyebrow">Physiology + behaviour</p><h1>Your biology and your life both matter.</h1><p>Nutrition counselling can consider physiological needs while also paying attention to the circumstances in which eating actually happens.</p><p>A recommendation is only useful if it is nutritionally appropriate and realistic enough to put into practice.</p></div>
            <div class="relationship-map reveal" aria-label="Physiology plus real life leads to practical nutrition">
              <div><h3>Physiology</h3><p>appetite · energy · nutritional needs · life stage</p></div><b>+</b>
              <div><h3>Real life</h3><p>routines · preferences · environment · motivation</p></div><b>→</b>
              <div class="relationship-result"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.2 17 19 7"></path></svg><h3>Practical nutrition</h3></div>
            </div>
          </div>
        </section>

        <section class="section-pad behaviour-knowing">
          <div class="section-shell content-grid">
            <header><p class="eyebrow">Knowing isn’t always the problem</p><h2>Knowing what to do is only part of the picture.</h2></header>
            <div class="prose reveal"><p>What we eat is influenced by more than nutrition knowledge. Appetite, energy and nutritional needs matter. So do habits, preferences, motivation, schedules, environment and experience.</p><p>You may already know a lot about nutrition. You may have tried different approaches or collected more advice than you know what to do with.</p><p>The useful question is not simply “What should I eat?”</p><p class="behaviour-question">What will actually work in my life?</p></div>
          </div>
        </section>

        <section class="behaviour-factors section-pad">
          <div class="section-shell">
            <div class="section-heading"><p class="eyebrow">What we can look at together</p><h2>The things that shape eating in real life.</h2></div>
            <div class="factor-list reveal">
              <details><summary>Routines &amp; cues</summary><p>The patterns around when, where and how you eat.</p></details>
              <details><summary>Real-life constraints</summary><p>What happens when work is busy, energy is low, schedules change or plans fall apart.</p></details>
              <details><summary>Motivation</summary><p>What matters to you and what feels realistic enough to continue.</p></details>
              <details><summary>Preferences</summary><p>Food you enjoy, cultural preferences, access, budget and convenience.</p></details>
              <details><summary>Patterns</summary><p>Including all-or-nothing thinking around food and routines that can make consistency harder.</p></details>
              <details><summary>Adjustments</summary><p>Small changes we can try, learn from and refine without expecting perfection immediately.</p></details>
            </div>
          </div>
        </section>

        <section class="behaviour-together section-pad">
          <div class="section-shell content-grid">
            <header><p class="eyebrow">How we work together</p><h2>We figure it out together.</h2></header>
            <div class="prose reveal"><p>We start by understanding what is happening now—your nutrition, routines, preferences, goals and the things making change easier or harder.</p><p>From there, we identify the nutrition priorities that matter most and turn them into practical next steps.</p><p>Then we learn from what happens in real life. What works stays. What doesn’t can be adjusted.</p><div class="together-anchors"><span>Understand what’s happening.</span><span>Focus on what matters.</span><span>Adjust as you go.</span></div></div>
          </div>
        </section>

        <section class="behaviour-scope"><div class="section-shell"><p><strong>Within nutritional counselling:</strong> Behaviour-change support focuses on eating patterns, habits, motivation and practical barriers related to nutrition. It is not psychotherapy or psychological treatment.</p></div></section>

        <section class="contact section-pad"><div class="contact-inner section-shell"><img src="../assets/orbit-logo-reverse.svg" alt="" width="88" height="88"><p class="eyebrow">Start where you are</p><h2>Healthy eating has to fit real life.</h2><p>You don’t need another perfect plan. You need nutrition recommendations that make sense for your body and can actually live alongside the rest of your life.</p><div class="button-row contact-actions"><a class="button button-light" href="mailto:hello@theumethod.ca?subject=Consultation%20booking">Book a consultation</a><a class="button button-outline-light" href="/nutritional-counselling/">Explore nutrition counselling →</a></div></div></section>`;
    }

    function transformSite() {
      const doc = frame.contentDocument;
      if (!doc?.body) return;

      doc.title = 'biome | Nutrition Counselling';
      replaceText(doc);

      let favicon = doc.querySelector('link[rel="icon"]');
      if (!favicon) {
        favicon = doc.createElement('link');
        favicon.rel = 'icon';
        favicon.type = 'image/svg+xml';
        doc.head.appendChild(favicon);
      }
      favicon.href = 'assets/biome-favicon.svg';

      const style = doc.createElement('style');
      style.textContent = `
        .brand { gap: 0 !important; }
        .biome-lockup { display: grid; line-height: 1; }
        .biome-wordmark { display: inline-flex; align-items: center; color: var(--ink); font: 800 2.3125rem/.86 Manrope, sans-serif; letter-spacing: -.075em; white-space: nowrap; }
        .biome-bi { color: var(--ink); font-weight: 400; }
        .biome-me { color: var(--sage); font-weight: 800; }
        .biome-o { position: relative; display: inline-grid; width: .72em; height: .72em; margin: 0 .035em; place-items: center; transform: translateY(.035em); }
        .biome-o::before { content: ''; position: absolute; inset: 4%; border-radius: 50%; background: radial-gradient(circle, #fff 0 34%, var(--cloud) 35% 76%, transparent 77%); }
        .biome-o svg { position: relative; z-index: 1; width: 100%; height: 100%; overflow: visible; }
        .biome-o-ring { fill: none; stroke: var(--sage-light); stroke-width: 1; stroke-dasharray: 1 3; }
        .biome-o-lines { stroke: var(--sage-light); stroke-width: 1; }
        .biome-o-nodes { fill: var(--sage); }
        .biome-o-centre { fill: var(--ink); stroke: none; }
        .biome-descriptor { margin-top: .42rem; color: var(--sage-deep); font: 700 .57rem/1 Manrope, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
        .hero-orbit .orbit-u { font-size: 1.25rem !important; letter-spacing: -.02em; }
        .contact .biome-lockup { justify-items: center; margin-bottom: .5rem; }
        .contact .biome-wordmark { color: #fff; font-size: 3.2rem; }
        .contact .biome-bi { color: #fff; }
        .contact .biome-me { color: var(--sage-light); }
        .contact .biome-o-ring, .contact .biome-o-lines { stroke: rgba(255,255,255,.42); }
        .contact .biome-o-nodes { fill: var(--sage-light); }
        .contact .biome-o-centre { fill: #fff; stroke: none; }
        .contact .biome-o::before { background: radial-gradient(circle, var(--ink) 0 35%, rgba(255,255,255,.1) 36% 76%, transparent 77%); }
        .biome-service-visual { margin: 0; padding: 0; overflow: hidden; min-height: 18rem; display: grid; place-items: end center; background: #fff; }
        .biome-service-visual img { display: block; width: 100%; height: 100%; min-height: 18rem; object-fit: cover; object-position: 50% 72%; }
        .biome-insurance { overflow: hidden; color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: 0 18px 40px rgba(36,51,65,.06); }
        .biome-insurance summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.4rem; cursor: pointer; list-style: none; font: 700 1rem/1.25 Manrope,sans-serif; }
        .biome-insurance summary::-webkit-details-marker { display: none; }
        .biome-insurance summary::after { content: '⌄'; flex: 0 0 auto; color: var(--sage-deep); font-size: 1.35rem; font-weight: 500; line-height: 1; transform: translateY(-.12rem); }
        .biome-insurance[open] summary::after { transform: rotate(180deg) translateY(-.12rem); }
        .biome-insurance[open] summary { border-bottom: 1px solid var(--line); }
        .biome-insurance p { margin: 0; padding: 1.25rem 1.5rem 1.5rem; color: var(--muted); font-size: .94rem; }
        .insurance-title { display: inline-flex; align-items: center; gap: .75rem; }
        .insurance-title svg { width: 1.35rem; height: 1.35rem; fill: none; stroke: var(--sage-deep); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .biome-insurance-hero { align-self: end; }
        .services .biome-insurance { max-width: 45rem; margin-top: 1rem; color: var(--ink); border-color: var(--line); background: var(--cloud); box-shadow: none; }
        .services .biome-insurance summary { color: var(--ink); }
        .services .biome-insurance summary::after { color: var(--sage-deep); }
        .services .biome-insurance[open] summary { border-color: var(--line); }
        .services .biome-insurance p { color: var(--muted); }
        .services .biome-insurance .insurance-title svg { stroke: var(--sage-deep); }
        .biome-intro-chat { width: 100%; max-width: 68rem; margin: 2rem 0 0; padding: 1.4rem 1.55rem; color: var(--ink); border: 1px solid var(--line); border-radius: 1.25rem; background: var(--cloud); }
        .biome-intro-chat p { margin: 0; }
        .biome-intro-chat p + p { margin-top: .4rem; }
        .biome-intro-chat a { display: inline-block; margin-top: .85rem; color: var(--ink); font-weight: 700; text-underline-offset: .28rem; }
        .services .price-card:nth-child(1) { background: #304250; border-color: rgba(199,210,196,.28); }
        .services .price-card:nth-child(2) { background: #3d4c4b; border-color: rgba(199,210,196,.32); }
        .services .price-card:nth-child(3) { background: #53684f; border-color: transparent; }
        .services .pricing-grid { max-width: 68rem; }
        .services .price-card { min-height: 0 !important; aspect-ratio: 1 / 1; padding: 1.55rem !important; }
        .contact-actions { margin-top: 2.35rem !important; }
        .method-without-circles .method-layout { grid-template-columns: 1fr; }
        .method-without-circles .method-copy { max-width: 52rem; }
        .expect-heading { display: block !important; }
        .expect-heading .eyebrow { margin-top: 0; }
        .expect-heading h2 { max-width: 18ch; margin-top: .85rem; justify-self: start; text-align: left !important; overflow-wrap: normal; }
        .behaviour-ecosystem { position: relative; min-height: 25rem; border-radius: 48% 52% 44% 56% / 54% 42% 58% 46%; background: color-mix(in srgb, var(--sage-light) 35%, white); }
        .behaviour-ecosystem::before, .behaviour-ecosystem::after { content: ''; position: absolute; inset: 12%; border: 1px solid var(--sage-light); border-radius: 44% 56% 53% 47% / 47% 42% 58% 53%; transform: rotate(12deg); }
        .behaviour-ecosystem::after { inset: 26%; transform: rotate(-13deg); }
        .behaviour-ecosystem strong { position: absolute; inset: 50% auto auto 50%; z-index: 2; display: grid; width: 5rem; height: 5rem; place-items: center; color: white; background: var(--ink); border-radius: 50%; transform: translate(-50%,-50%); font: 800 1rem Manrope,sans-serif; }
        .eco-node { position: absolute; z-index: 2; color: var(--sage-deep); font: 700 .75rem Manrope,sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        .eco-body { top: 13%; left: 46%; } .eco-food { top: 48%; right: 8%; } .eco-behaviour { bottom: 12%; left: 39%; } .eco-life { top: 48%; left: 8%; }
        .behaviour-question { margin-top: 2rem !important; padding-left: 1.25rem; color: var(--ink) !important; border-left: 3px solid var(--sage); font: 800 clamp(1.6rem,3vw,2.6rem)/1.15 Manrope,sans-serif !important; letter-spacing: -.035em; }
        .behaviour-factors { background: var(--paper); }
        .factor-list { margin-top: 3rem; border-top: 1px solid var(--line); }
        .factor-list details { border-bottom: 1px solid var(--line); }
        .factor-list summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 0; cursor: pointer; list-style: none; color: var(--ink); font: 700 1.05rem/1.3 Manrope,sans-serif; }
        .factor-list summary::-webkit-details-marker { display: none; }
        .factor-list summary::after { content: '+'; flex: 0 0 auto; color: var(--sage-deep); font-size: 1.35rem; font-weight: 400; }
        .factor-list details[open] summary::after { content: '−'; }
        .factor-list p { max-width: 46rem; margin: -.25rem 0 1.35rem; padding-right: 2rem; }
        .factor-list p { color: var(--muted); }
        .behaviour-relationship { padding-block: clamp(3.25rem, 6vw, 5.5rem); color: white; background: var(--ink); }
        .behaviour-relationship h1, .behaviour-relationship h2, .behaviour-relationship h3 { color: white; }
        .behaviour-relationship-copy { max-width: 46rem; }
        .behaviour-relationship-copy h1 { max-width: 16ch; font-size: clamp(2.65rem, 5vw, 4.8rem); line-height: 1; letter-spacing: -.05em; }
        .behaviour-relationship-copy > p:not(.eyebrow) { max-width: 46rem; color: rgba(255,255,255,.72); }
        .relationship-map { display: grid; grid-template-columns: 1fr auto 1fr auto .68fr; align-items: center; gap: 1rem; margin-top: 2.5rem; }
        .relationship-map > div { min-height: 7rem; padding: 1.05rem; border-top: 1px solid rgba(255,255,255,.25); }
        .relationship-map p { color: rgba(255,255,255,.65); }
        .relationship-map > b { color: var(--sage-light); font-size: 1.6rem; }
        .relationship-result { display: flex; width: 100%; max-width: 13rem; min-height: 5.8rem !important; align-items: center; justify-content: flex-start; gap: .8rem; background: var(--sage-deep); border-radius: var(--radius); border-top: 0 !important; }
        .relationship-result svg { flex: 0 0 auto; width: 1.45rem; fill: none; stroke: var(--sage-light); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .relationship-result h3 { margin: 0; }
        .together-anchors { display: grid; gap: .75rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
        .together-anchors span { color: var(--ink); font: 700 1.05rem Manrope,sans-serif; }
        .behaviour-scope { padding: 1.3rem 0; color: var(--muted); background: var(--cloud); border-block: 1px solid var(--line); }
        .behaviour-scope p { max-width: 70rem; margin: 0; font-size: .86rem; }
        .behaviour-hero .reveal, .behaviour-knowing .reveal, .behaviour-factors .reveal, .behaviour-relationship .reveal, .behaviour-together .reveal { opacity: 1 !important; transform: none !important; }
        @media (max-width: 760px) {
          .biome-wordmark { font-size: 2rem; }
          .about-copy { min-width: 0; width: 100%; }
          .about-copy .service-line { white-space: normal; }
          .expect-heading { gap: 1rem !important; }
          .expect-heading h2 { max-width: 13ch; font-size: clamp(2.25rem, 10.5vw, 3.25rem); line-height: 1.02; }
          .biome-service-visual, .biome-service-visual img { min-height: 12rem; }
          .behaviour-ecosystem { min-height: 20rem; }
          .relationship-map { grid-template-columns: 1fr; gap: .55rem; }
          .relationship-map > b { transform: rotate(90deg); transform-origin: left center; }
          .relationship-map > div { min-height: 0; }
          .services .price-card { aspect-ratio: auto; min-height: 17rem !important; }
        }
      `;
      doc.head.appendChild(style);

      const currentPath = frame.contentWindow.location.pathname;
      const isServicesPage = currentPath.includes('/nutritional-counselling/');
      const isBehaviourPage = currentPath.includes('/nutrition-behaviour-change/');
      if (isBehaviourPage) rewriteBehaviourPage(doc);

      const brand = doc.querySelector('.brand');
      if (brand) {
        brand.setAttribute('aria-label', 'biome Nutrition Counselling home');
        brand.setAttribute('href', sitePath('u-method-original.html'));
        brand.innerHTML = wordmarkMarkup(true);
      }

      const orbit = doc.querySelector('.hero-orbit');
      if (orbit) orbit.setAttribute('aria-label', 'A connected system with you at the centre, considering nutrition, movement, sleep, preferences, goals, routines, lifestyle and life stage');
      const centreWord = orbit?.querySelector('.orbit-u');
      if (centreWord) centreWord.textContent = 'you';

      const methodEyebrow = [...doc.querySelectorAll('.eyebrow')].find((el) => el.textContent.trim().toLowerCase() === 'biome');
      if (methodEyebrow) methodEyebrow.textContent = 'How we work together';

      const homeMethod = doc.querySelector('#method');
      if (homeMethod) {
        homeMethod.classList.add('method-without-circles');
        const methodTitle = homeMethod.querySelector('.section-heading h2');
        if (methodTitle) methodTitle.textContent = 'Nutrition that works in real life.';
        const circles = homeMethod.querySelectorAll('.method-circle');
        const circleCopy = [
          ['Understand what’s happening', 'We look at your nutrition, routines, preferences, goals and what is making change easier or harder.'],
          ['Focus on what matters', 'We identify the nutrition priorities that deserve your attention and turn them into practical next steps.'],
          ['Adjust as you go', 'We learn from what happens in real life, keep what works and adjust what doesn’t.']
        ];
        circles.forEach((circle, index) => {
          if (!circleCopy[index]) return;
          circle.querySelector('h3').textContent = circleCopy[index][0];
          circle.querySelector('p').textContent = circleCopy[index][1];
        });
        const methodAria = homeMethod.querySelector('.method-circles');
        if (methodAria) methodAria.remove();
        const methodCopy = homeMethod.querySelector('.method-copy');
        if (methodCopy) {
          const copyTitle = methodCopy.querySelector('h3');
          const copyParagraphs = methodCopy.querySelectorAll(':scope > p');
          if (copyTitle) {
            copyTitle.textContent = 'Your biology and your life both matter.';
            const label = doc.createElement('p');
            label.className = 'eyebrow';
            label.textContent = 'Physiology + behaviour';
            copyTitle.before(label);
          }
          if (copyParagraphs[0]) copyParagraphs[0].textContent = 'Nutrition counselling can consider physiological needs while also paying attention to the circumstances in which eating actually happens.';
          if (copyParagraphs[1]) copyParagraphs[1].textContent = 'A recommendation is only useful if it is nutritionally appropriate and realistic enough to put into practice.';
        }
      }

      const whoDescriptions = [
        'Support adequate nutrition while using GLP-1 medications.',
        'Nutrition through midlife, perimenopause and changing priorities.',
        'Make sense of conflicting nutrition advice.',
        'Build eating patterns and habits that work in real life.',
        'Explore sensitivities, tolerance and digestion patterns.',
        'Support energy, recovery and an active lifestyle.'
      ];
      doc.querySelectorAll('#who .who-list li').forEach((item, index) => {
        const description = item.querySelector('p');
        if (description && whoDescriptions[index]) description.textContent = whoDescriptions[index];
      });

      const contact = doc.querySelector('.contact-inner');
      const contactLogo = contact?.querySelector('img');
      if (contactLogo) {
        const wrapper = doc.createElement('div');
        wrapper.innerHTML = wordmarkMarkup(false);
        contactLogo.replaceWith(wrapper.firstElementChild);
      }
      const contactTitle = contact?.querySelector('h2');
      if (contactTitle && !isBehaviourPage) contactTitle.innerHTML = 'It starts with <em>you.</em>';

      doc.querySelectorAll('figcaption').forEach((caption) => {
        if (caption.textContent.includes('No one-size-fits-all rules')) caption.remove();
      });
      doc.querySelectorAll('.quote-line').forEach((quote) => {
        if (quote.textContent.includes('To make nutrition easier to understand and easier to live')) quote.remove();
      });
      [...doc.querySelectorAll('h3')].forEach((heading) => {
        if (heading.textContent.trim() === 'Professional identity') heading.remove();
      });
      doc.querySelectorAll('.contact .eyebrow').forEach((eyebrow) => {
        if (eyebrow.textContent.trim() === 'A conversation is enough to begin') eyebrow.remove();
      });
      doc.querySelectorAll('.contact p:not(.eyebrow)').forEach((paragraph) => {
        if (paragraph.textContent.includes('Tell me what you are hoping to work on. We can find out whether this feels like the right fit')) paragraph.remove();
      });

      const heroLede = doc.querySelector('#home .hero-copy .lede');
      if (heroLede) {
        heroLede.textContent = "Your nutrition is connected to more than what’s on your plate. Together, we’ll look at your food, routines, lifestyle, goals and life stage to find an approach that works for you.";
      }

      const services = doc.querySelector('.services');
      const servicesIntro = services?.querySelector('.services-intro');
      const servicesTitle = servicesIntro?.querySelector('h2');
      const servicesSummary = servicesIntro?.querySelector(':scope > p');
      if (servicesTitle) servicesTitle.textContent = isServicesPage ? 'Ways we can work together' : 'Support built around you.';
      if (servicesSummary) {
        servicesSummary.textContent = isServicesPage
          ? 'Choose the kind of support that makes sense for you.'
          : 'Nutrition counselling looks at more than food. It helps you make practical choices that work with your health, routines, preferences, goals and real life.';
      }

      const pricingGrid = services?.querySelector('.pricing-grid');
      if (pricingGrid) {
        pricingGrid.innerHTML = `
          <article class="price-card">
            <p class="duration">Initial consultation · 60 minutes — $145</p>
            <h3>Nutrition &amp; Health Consultation</h3>
            <p>A comprehensive conversation about your nutrition, health, routines, preferences and goals. We’ll identify what matters most and create practical, personalized next steps that fit your life.</p>
            <div class="price-row"><a href="mailto:hello@theumethod.ca?subject=Initial%20nutrition%20consultation">Book ↗</a></div>
          </article>
          <article class="price-card">
            <p class="duration">Follow-up · 30 minutes — $80</p>
            <h3>Nutrition Counselling Follow-Up</h3>
            <p>A focused session to review progress, work through challenges, answer questions and adjust your recommendations as needed.</p>
            <div class="price-row"><a href="mailto:hello@theumethod.ca?subject=Nutrition%20counselling%20follow-up">Book ↗</a></div>
          </article>
          <article class="price-card featured">
            <p class="duration">Consultation + 7-day meal plan + follow-up — <strong>$295</strong></p>
            <h3>Personalized Nutrition Package</h3>
            <p>A 60-minute consultation, a personalized 7-day meal plan built for your real life, and a 30-minute follow-up to review and adjust it together.</p>
            <div class="price-row"><a href="mailto:hello@theumethod.ca?subject=Personalized%20nutrition%20package">Book ↗</a></div>
          </article>`;

        const existingChat = services.querySelector('.biome-intro-chat');
        if (existingChat) existingChat.remove();
        const chat = doc.createElement('aside');
        chat.className = 'biome-intro-chat';
        chat.innerHTML = `<p><strong>Not sure where to start?</strong></p><p>Book a complimentary <strong>15-minute introductory chat</strong> to ask questions and see whether working together feels like a good fit.</p><a href="mailto:hello@theumethod.ca?subject=Free%2015-minute%20introductory%20chat">Book a free 15-minute chat →</a>`;
        pricingGrid.insertAdjacentElement('afterend', chat);

        const coverageNote = services.querySelector('.coverage-note');
        if (coverageNote && !isServicesPage) {
          const insurance = doc.createElement('details');
          insurance.className = 'biome-insurance';
          insurance.innerHTML = insuranceMarkup();
          coverageNote.replaceWith(insurance);
        }
      }

      if (isServicesPage) {
        const pageHero = doc.querySelector('.page-hero');
        const pageTitle = pageHero?.querySelector('.page-hero-copy h1');
        const pageSummary = pageHero?.querySelector('.page-hero-copy > p:not(.eyebrow)');
        if (pageTitle) pageTitle.textContent = 'Support built around you.';
        if (pageSummary) pageSummary.textContent = 'Nutrition counselling looks at more than food. It helps you make practical choices that work with your health, routines, preferences, goals and real life.';

        const aside = pageHero?.querySelector('.page-hero-aside');
        if (aside) {
          aside.className = 'biome-insurance biome-insurance-hero';
          aside.innerHTML = insuranceMarkup();
          const details = doc.createElement('details');
          details.className = aside.className;
          details.innerHTML = aside.innerHTML;
          aside.replaceWith(details);
        }

        services?.querySelector('.coverage-note')?.remove();
        [...doc.querySelectorAll('.prose p')].forEach((paragraph) => {
          if (paragraph.textContent.trim().startsWith('You do not need a perfectly defined goal or a diagnosis before you book')) paragraph.remove();
        });
        doc.querySelector('.related-grid')?.closest('section')?.remove();

        if (services && pageHero) pageHero.insertAdjacentElement('afterend', services);

        const main = doc.querySelector('main');
        if (main && !doc.querySelector('#faq')) {
          main.insertAdjacentHTML('beforeend', `
            <section id="faq" class="faq section-pad">
              <div class="section-shell faq-grid">
                <div><p class="eyebrow">Good to know</p><h2>Frequently asked questions.</h2></div>
                <div class="accordion">
                  <details open><summary>What happens in a first consultation?</summary><p>We’ll talk through your nutrition, health, routines, preferences and goals, then identify clear priorities and practical next steps that fit your life.</p></details>
                  <details><summary>What is included in the Personalized Nutrition Package?</summary><p>A 60-minute consultation, a personalized 7-day meal plan and a 30-minute follow-up to review what is working and make adjustments.</p></details>
                  <details><summary>Are appointments covered by health insurance?</summary><p>Many extended health plans cover nutritional consulting, but coverage varies. Confirm directly with your provider. A receipt with the RNCP, NNCP and RRSW designations is issued after each session.</p></details>
                  <details><summary>Do I need a diagnosis or referral?</summary><p>No. You can book directly. When something needs medical assessment or care beyond nutrition education, referral is a normal part of good care.</p></details>
                </div>
              </div>
            </section>`);
        }
      }

      const homeFaq = doc.querySelector('#faq');
      const homeServices = doc.querySelector('#services');
      if (homeFaq && homeServices && !isServicesPage) homeServices.insertAdjacentElement('afterend', homeFaq);
      homeFaq?.querySelector('a[href="/faq/"]')?.remove();

      doc.querySelectorAll('a').forEach((link) => {
        const originalHref = link.getAttribute('href');
        if (originalHref === '/faq/') { link.remove(); return; }
        if (originalHref === '/') link.setAttribute('href', sitePath('u-method-original.html'));
        else if (originalHref === '/#who') link.setAttribute('href', `${sitePath('u-method-original.html')}#who`);
        else if (originalHref?.startsWith('/') && !originalHref.startsWith('//')) link.setAttribute('href', sitePath(originalHref));
        if (link.textContent.trim().toLowerCase().startsWith('learn more')) { link.remove(); return; }
        if (link.closest('.site-nav') && link.getAttribute('href')?.includes('/nutrition-behaviour-change/')) link.textContent = 'Nutrition & behaviour';
        if (link.closest('.site-nav') && link.getAttribute('href')?.includes('/digest/')) link.textContent = 'Digest';
        if (link.textContent.includes('discovery call')) link.textContent = link.textContent.replace('discovery call', 'introductory chat');
        if (link.href.includes('discovery%20call')) link.href = link.href.replace('discovery%20call', 'introductory%20chat');
      });

      doc.querySelectorAll('[aria-label]').forEach((el) => {
        el.setAttribute('aria-label', el.getAttribute('aria-label').replaceAll('The U Method', 'biome').replaceAll('The U Digest', 'biome Digest').replaceAll('BIOME', 'biome'));
      });

      document.documentElement.classList.add('ready');
    }

    frame.addEventListener('load', transformSite);
  </script>
</body>
</html>
